name: Build and test
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'optimization/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Portable core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Configure core
        run: cmake -S . -B build/core -DFEATHERCAST_BUILD_APP=OFF -DFEATHERCAST_BUILD_ENGINE=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile with warnings
        run: cmake --build build/core --parallel 2
      - name: Run core regression tests
        run: ctest --test-dir build/core --output-on-failure
      - name: Check whitespace
        run: git diff --check HEAD~1 HEAD
  windows:
    name: Windows Qt application
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Provision pinned dependencies
        run: python scripts/bootstrap.py
      - name: Build Release and run core tests
        shell: pwsh
        run: ./scripts/build.ps1 -SkipBootstrap -Configuration Release
      - name: Build Debug
        shell: pwsh
        run: ./scripts/build.ps1 -SkipBootstrap -Configuration Debug -SkipTests
      - name: Package development build
        run: work/toolenv/Scripts/python.exe scripts/package.py --version 0.1.0-dev-${{ github.run_number }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FeatherCast-development-Windows-x64
          path: |
            outputs/FeatherCast-*.zip
            outputs/FeatherCast-*.sha256
          if-no-files-found: error
          retention-days: 14
